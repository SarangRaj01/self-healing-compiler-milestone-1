<svg fill="none" viewBox="0 0 950 560" width="100%" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="comic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Filters -->
    <filter id="comic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .comic-title { font-family: 'Impact', 'Arial Black', sans-serif; letter-spacing: 1px; }
      .dialogue-text { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif; font-weight: bold; }
      .narrator-text { font-family: 'Courier New', monospace; font-weight: 700; }
      .mono-text { font-family: 'Fira Code', 'Consolas', monospace; }
      
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseAlert {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #ef4444); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 14px #ef4444); }
      }
      @keyframes shieldSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes speechBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes blastPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }

      .floating { animation: floatY 3s ease-in-out infinite; }
      .floating-delay { animation: floatY 3s ease-in-out infinite 1.5s; }
      .pulsing-alert { animation: pulseAlert 1.6s ease-in-out infinite; transform-origin: center; }
      .bobbing-speech { animation: speechBob 2s ease-in-out infinite; }
      .blast-star { animation: blastPulse 1s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="950" height="560" rx="16" fill="url(#comic-bg)" stroke="#334155" stroke-width="2"/>

  <!-- Comic Strip Header Banner -->
  <g transform="translate(25, 20)">
    <rect width="900" height="52" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="450" y="34" fill="#38bdf8" text-anchor="middle" class="comic-title" font-size="22" filter="url(#comic-glow)">
      ⚡ THE TALE OF TWO COMPILERS: HOW SHC SAVES YOUR CODE AT RUNTIME ⚡
    </text>
  </g>

  <!-- ==================== COMIC PANEL 1: THE REGULAR COMPILER (THE TRAGEDY) ==================== -->
  <g transform="translate(25, 85)">
    <!-- Panel Box -->
    <rect width="440" height="445" rx="12" fill="url(#panel-bg)" stroke="#ef4444" stroke-width="2.5"/>
    
    <!-- Panel Header Label -->
    <rect x="15" y="-14" width="220" height="28" rx="6" fill="#ef4444"/>
    <text x="125" y="5" fill="#ffffff" text-anchor="middle" class="narrator-text" font-size="12">
      CHAPTER 1: TRADITIONAL COMPILER
    </text>

    <!-- Sub-scene 1: Build-Time Laziness -->
    <g transform="translate(25, 30)">
      <!-- Lazy Compiler Character -->
      <circle cx="50" cy="45" r="32" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
      <!-- Sleeping Eyes -->
      <path d="M 38 42 Q 45 48 52 42" stroke="#f8fafc" stroke-width="2.5" fill="none"/>
      <path d="M 58 42 Q 65 48 72 42" stroke="#f8fafc" stroke-width="2.5" fill="none"/>
      <!-- Sleep ZZZ -->
      <text x="75" y="24" fill="#a855f7" font-size="16" font-weight="900" class="floating">Zzz...</text>
      <!-- Compiler Tag -->
      <rect x="20" y="85" width="60" height="18" rx="4" fill="#1e293b" stroke="#64748b"/>
      <text x="50" y="98" fill="#cbd5e1" font-size="9.5" text-anchor="middle" class="mono-text">GCC / Clang</text>

      <!-- Speech Bubble -->
      <g class="bobbing-speech" transform="translate(110, 15)">
        <path d="M 0 15 Q 0 0 15 0 L 260 0 Q 275 0 275 15 L 275 55 Q 275 70 260 70 L 30 70 L 10 85 L 15 70 Q 0 70 0 55 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <text x="135" y="26" fill="#0f172a" text-anchor="middle" class="dialogue-text" font-size="12">"I added a Stack Canary at build-time!"</text>
        <text x="135" y="46" fill="#b91c1c" text-anchor="middle" class="dialogue-text" font-size="12">"Now I'm leaving. Good luck at runtime! 😴"</text>
      </g>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="155" x2="420" y2="155" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- Sub-scene 2: The Attack Occurs & The Big Crash -->
    <g transform="translate(25, 175)">
      <!-- Malicious Payload Monster -->
      <g class="floating" transform="translate(10, 20)">
        <rect x="0" y="0" width="105" height="48" rx="8" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>
        <text x="52" y="22" fill="#ffffff" text-anchor="middle" font-size="11" class="mono-text" font-weight="bold">EXPLOIT (70B)</text>
        <text x="52" y="38" fill="#fecaca" text-anchor="middle" font-size="9" class="mono-text">&gt;&gt; 32B Buffer</text>
      </g>

      <!-- Target Victim Buffer -->
      <g transform="translate(135, 15)">
        <rect x="0" y="0" width="120" height="58" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
        <text x="60" y="22" fill="#f8fafc" text-anchor="middle" font-size="10.5" class="mono-text">char buf[32];</text>
        <text x="60" y="42" fill="#f87171" text-anchor="middle" font-size="10" font-weight="bold">OVERFLOWED!</text>
      </g>

      <!-- Comic CRASH / ABORT Explosion Star -->
      <g transform="translate(265, -5)" class="pulsing-alert">
        <polygon points="55,0 72,32 108,22 88,52 115,80 78,82 72,118 45,90 12,108 25,72 0,48 35,42" fill="#dc2626" stroke="#fef08a" stroke-width="3"/>
        <text x="55" y="55" fill="#fef08a" text-anchor="middle" class="comic-title" font-size="15">KILLED!</text>
        <text x="55" y="72" fill="#ffffff" text-anchor="middle" class="mono-text" font-size="9" font-weight="bold">SIGABRT</text>
      </g>

      <!-- Disaster Outcome Box -->
      <g transform="translate(10, 125)">
        <rect width="390" height="95" rx="8" fill="#450a0a" stroke="#b91c1c" stroke-width="1.5"/>
        <text x="20" y="26" fill="#fca5a5" font-size="13" font-weight="bold">💀 THE CONSEQUENCE:</text>
        <text x="20" y="48" fill="#fecaca" font-size="11.5" class="dialogue-text">• Process called abort() and died instantly.</text>
        <text x="20" y="68" fill="#fecaca" font-size="11.5" class="dialogue-text">• 100% Denial-of-Service (DoS) on subsequent users.</text>
        <text x="20" y="88" fill="#fca5a5" font-size="10.5" class="mono-text">• Recovery time: 30 minutes to rebuild &amp; redeploy.</text>
      </g>
    </g>
  </g>

  <!-- ==================== COMIC PANEL 2: THE SELF-HEALING COMPILER (THE HERO) ==================== -->
  <g transform="translate(485, 85)">
    <!-- Panel Box -->
    <rect width="440" height="445" rx="12" fill="url(#panel-bg)" stroke="#10b981" stroke-width="2.5"/>

    <!-- Panel Header Label -->
    <rect x="15" y="-14" width="240" height="28" rx="6" fill="#10b981"/>
    <text x="135" y="5" fill="#ffffff" text-anchor="middle" class="narrator-text" font-size="12">
      CHAPTER 2: SELF-HEALING COMPILER
    </text>

    <!-- Sub-scene 1: SHC Compiler Pass in Action -->
    <g transform="translate(25, 30)">
      <!-- Vigilant SHC Guardian Character -->
      <g transform="translate(15, 10)">
        <circle cx="35" cy="35" r="32" fill="#065f46" stroke="#34d399" stroke-width="2.5"/>
        <!-- Glowing Confident Eyes -->
        <circle cx="26" cy="30" r="4.5" fill="#38bdf8"/>
        <circle cx="44" cy="30" r="4.5" fill="#38bdf8"/>
        <!-- Grin -->
        <path d="M 25 45 Q 35 55 45 45" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- Superhero Badge -->
        <rect x="10" y="75" width="50" height="18" rx="4" fill="#047857" stroke="#6ee7b7"/>
        <text x="35" y="88" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold" class="mono-text">SHC</text>
      </g>

      <!-- Speech Bubble -->
      <g class="bobbing-speech" transform="translate(95, 12)">
        <path d="M 0 15 Q 0 0 15 0 L 290 0 Q 305 0 305 15 L 305 55 Q 305 70 290 70 L 30 70 L 10 85 L 15 70 Q 0 70 0 55 Z" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
        <text x="150" y="25" fill="#064e3b" text-anchor="middle" class="dialogue-text" font-size="12">"I stay INSIDE the running binary!"</text>
        <text x="150" y="44" fill="#047857" text-anchor="middle" class="dialogue-text" font-size="11.5">"I inserted runtime guards around memory!"</text>
        <text x="150" y="62" fill="#0284c7" text-anchor="middle" class="dialogue-text" font-size="11">"strcpy() ➔ shc_safe_strcpy() injected 🛡️"</text>
      </g>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="155" x2="420" y2="155" stroke="#334155" stroke-dasharray="4,4"/>

    <!-- Sub-scene 2: Real-time Interception & Zero Downtime -->
    <g transform="translate(25, 175)">
      <!-- Malicious Attack Attempt -->
      <g class="floating" transform="translate(10, 20)">
        <rect x="0" y="0" width="105" height="48" rx="8" fill="#b91c1c" stroke="#f87171" stroke-width="1.5"/>
        <text x="52" y="22" fill="#ffffff" text-anchor="middle" font-size="11" class="mono-text" font-weight="bold">ATTACK (70B)</text>
        <text x="52" y="38" fill="#fecaca" text-anchor="middle" font-size="9" class="mono-text">&gt;&gt; Trying to copy</text>
      </g>

      <!-- Glowing SHC Forcefield / Shield Barrier -->
      <g transform="translate(125, 0)">
        <path d="M 30 5 Q 60 5 60 40 Q 60 85 30 100 Q 0 85 0 40 Q 0 5 30 5 Z" fill="#047857" stroke="#34d399" stroke-width="3" filter="url(#comic-glow)"/>
        <text x="30" y="48" fill="#ffffff" text-anchor="middle" font-size="22">🛡️</text>
        <text x="30" y="70" fill="#a7f3d0" text-anchor="middle" font-size="9" font-weight="900" class="comic-title">BLOCKED!</text>
      </g>

      <!-- comic POW bubble -->
      <g transform="translate(195, 10)" class="blast-star">
        <polygon points="40,0 52,20 78,15 62,38 80,60 55,60 50,85 32,65 8,78 18,52 0,35 25,30" fill="#facc15" stroke="#b45309" stroke-width="2"/>
        <text x="40" y="40" fill="#78350f" text-anchor="middle" font-size="11" class="comic-title">DENIED!</text>
        <text x="40" y="55" fill="#9a3412" text-anchor="middle" font-size="8.5" class="mono-text" font-weight="bold">&lt; 1 µs</text>
      </g>

      <!-- Protected Buffer -->
      <g transform="translate(290, 20)">
        <rect x="0" y="0" width="115" height="48" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.8"/>
        <text x="57" y="22" fill="#ecfdf5" text-anchor="middle" font-size="10.5" class="mono-text">char buf[32];</text>
        <text x="57" y="38" fill="#6ee7b7" text-anchor="middle" font-size="9.5" font-weight="bold">100% UNTOUCHED!</text>
      </g>

      <!-- Happy Hero Outcome Box -->
      <g transform="translate(10, 125)">
        <rect width="390" height="95" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
        <text x="20" y="26" fill="#6ee7b7" font-size="13" font-weight="bold">🎉 THE SELF-HEALING VICTORY:</text>
        <text x="20" y="48" fill="#a7f3d0" font-size="11.5" class="dialogue-text">• Oversized input rejected BEFORE copying into memory.</text>
        <text x="20" y="68" fill="#a7f3d0" font-size="11.5" class="dialogue-text">• Process stays 100% ALIVE with zero downtime!</text>
        <text x="20" y="88" fill="#6ee7b7" font-size="10.5" class="mono-text">• Next valid request executed smoothly! 🚀</text>
      </g>
    </g>
  </g>
</svg>
