<svg fill="none" viewBox="0 0 950 560" width="100%" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .sketch-text { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif; font-weight: bold; fill: #ffffff; }
      .mono-text { font-family: 'Fira Code', 'Courier New', monospace; fill: #cccccc; }
      .title-text { font-family: 'Courier New', monospace; font-weight: 900; fill: #ffffff; letter-spacing: 1.5px; }

      /* Stickman keyframe animations */
      @keyframes floatHead {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes sleepZzz {
        0% { opacity: 0; transform: translate(0, 0) scale(0.7); }
        50% { opacity: 1; transform: translate(6px, -10px) scale(1.1); }
        100% { opacity: 0; transform: translate(12px, -20px) scale(1.4); }
      }
      @keyframes walkAttack {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(8px); }
      }
      @keyframes blockBounce {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-6px); }
      }
      @keyframes explodeDotted {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes shieldPulse {
        0%, 100% { opacity: 0.9; stroke-width: 2.5; }
        50% { opacity: 0.4; stroke-width: 4; }
      }

      .sleeping-z1 { animation: sleepZzz 2.2s infinite; }
      .sleeping-z2 { animation: sleepZzz 2.2s infinite 0.7s; }
      .sleeping-z3 { animation: sleepZzz 2.2s infinite 1.4s; }
      .attacker-bob { animation: walkAttack 2s ease-in-out infinite; }
      .shc-guardian { animation: floatHead 2.5s ease-in-out infinite; }
      .shield-anim { animation: shieldPulse 1.8s ease-in-out infinite; }
      .blast-star { animation: explodeDotted 1.4s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Chalkboard / Blueprint Black-and-White Background -->
  <rect width="950" height="560" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- Comic Title Banner (Black, White & Monochrome Grey) -->
  <g transform="translate(25, 20)">
    <rect width="900" height="50" rx="8" fill="#161b22" stroke="#ffffff" stroke-width="1.8"/>
    <text x="450" y="32" text-anchor="middle" class="title-text" font-size="18">
      THE STICKMAN CHRONICLES: WHAT ACTUALLY HAPPENS TO YOUR BUFFER
    </text>
  </g>

  <!-- ==================== PANEL 1: TRADITIONAL COMPILER (CHAOS & CRASH) ==================== -->
  <g transform="translate(25, 85)">
    <!-- Box outline -->
    <rect width="440" height="450" rx="10" fill="#0f141c" stroke="#8b949e" stroke-width="2"/>
    
    <!-- Chapter Tag -->
    <rect x="15" y="-14" width="220" height="26" rx="4" fill="#21262d" stroke="#ffffff" stroke-width="1.2"/>
    <text x="125" y="4" fill="#ffffff" text-anchor="middle" class="title-text" font-size="11">
      ACT 1: STANDARD COMPILER
    </text>

    <!-- Sub-scene 1: Stickman Compiler leaves early -->
    <g transform="translate(20, 25)">
      <!-- Sleeping / Walking Away Stickman Compiler -->
      <g transform="translate(30, 20)">
        <!-- Head -->
        <circle cx="20" cy="15" r="14" stroke="#ffffff" stroke-width="2" fill="none"/>
        <!-- Eyes (Closed - Zzz) -->
        <line x1="14" y1="14" x2="18" y2="17" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="22" y1="17" x2="26" y2="14" stroke="#ffffff" stroke-width="1.5"/>
        <!-- Body -->
        <line x1="20" y1="29" x2="20" y2="60" stroke="#ffffff" stroke-width="2"/>
        <!-- Arms (Relaxed / Shrugging) -->
        <line x1="20" y1="40" x2="6" y2="52" stroke="#ffffff" stroke-width="2"/>
        <line x1="20" y1="40" x2="34" y2="52" stroke="#ffffff" stroke-width="2"/>
        <!-- Legs (Walking away) -->
        <line x1="20" y1="60" x2="8" y2="85" stroke="#ffffff" stroke-width="2"/>
        <line x1="20" y1="60" x2="30" y2="85" stroke="#ffffff" stroke-width="2"/>
        <!-- Tag -->
        <text x="20" y="102" fill="#8b949e" font-size="9" text-anchor="middle" class="mono-text">GCC / Clang</text>
      </g>

      <!-- Animated Zzz -->
      <text x="75" y="32" class="mono-text sleeping-z1" font-size="12">z</text>
      <text x="82" y="24" class="mono-text sleeping-z2" font-size="15">Z</text>
      <text x="91" y="14" class="mono-text sleeping-z3" font-size="19">Z</text>

      <!-- Speech Bubble -->
      <g transform="translate(105, 10)">
        <path d="M 0 12 Q 0 0 12 0 L 280 0 Q 292 0 292 12 L 292 50 Q 292 62 280 62 L 25 62 L 10 75 L 14 62 Q 0 62 0 50 Z" fill="#161b22" stroke="#ffffff" stroke-width="1.8"/>
        <text x="146" y="24" text-anchor="middle" class="sketch-text" font-size="12">"I compiled your C code."</text>
        <text x="146" y="44" text-anchor="middle" class="sketch-text" font-size="11.5">"My job is done. I'm going to sleep!"</text>
      </g>
    </g>

    <line x1="20" y1="150" x2="420" y2="150" stroke="#30363d" stroke-dasharray="3,3"/>

    <!-- Sub-scene 2: The Attack & The Stickman Dying -->
    <g transform="translate(20, 165)">
      <!-- Attack Stickman with Battering Ram Payload -->
      <g transform="translate(10, 20)" class="attacker-bob">
        <!-- Head with Horns / Evil Mask -->
        <circle cx="20" cy="15" r="14" stroke="#ffffff" stroke-width="2" fill="none"/>
        <path d="M 12 9 L 8 2" stroke="#ffffff" stroke-width="1.8"/>
        <path d="M 28 9 L 32 2" stroke="#ffffff" stroke-width="1.8"/>
        <!-- Smirk -->
        <path d="M 14 20 Q 20 24 26 20" stroke="#ffffff" stroke-width="1.5" fill="none"/>
        <!-- Body -->
        <line x1="20" y1="29" x2="20" y2="60" stroke="#ffffff" stroke-width="2"/>
        <!-- Arms holding oversized payload box -->
        <line x1="20" y1="40" x2="45" y2="40" stroke="#ffffff" stroke-width="2"/>
        <!-- Legs charging forward -->
        <line x1="20" y1="60" x2="5" y2="85" stroke="#ffffff" stroke-width="2"/>
        <line x1="20" y1="60" x2="35" y2="85" stroke="#ffffff" stroke-width="2"/>

        <!-- Oversized Payload Box -->
        <rect x="45" y="24" width="75" height="32" rx="4" fill="#000000" stroke="#ffffff" stroke-width="1.8"/>
        <text x="82" y="44" fill="#ffffff" text-anchor="middle" font-size="10" class="mono-text" font-weight="bold">70 BYTES</text>
      </g>

      <!-- Victim Buffer Box -->
      <g transform="translate(145, 42)">
        <rect x="0" y="0" width="70" height="32" rx="4" fill="#161b22" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="4,2"/>
        <text x="35" y="20" fill="#ffffff" text-anchor="middle" font-size="9.5" class="mono-text">buf[32]</text>
      </g>

      <!-- Exploding Comic Blast (Abort / Crash) -->
      <g transform="translate(240, 5)" class="blast-star">
        <polygon points="50,0 65,30 95,20 78,50 105,75 70,78 65,110 40,85 10,100 22,68 0,45 32,40" fill="#000000" stroke="#ffffff" stroke-width="2.5"/>
        <text x="52" y="52" fill="#ffffff" text-anchor="middle" class="title-text" font-size="13">CRASH!</text>
        <text x="52" y="68" fill="#cccccc" text-anchor="middle" class="mono-text" font-size="9">SIGABRT</text>
      </g>

      <!-- Dead / Knocked-Out Victim Stickman -->
      <g transform="translate(345, 75)">
        <!-- Fallen horizontal stickman -->
        <circle cx="20" cy="15" r="10" stroke="#ffffff" stroke-width="1.8" fill="none"/>
        <!-- X eyes -->
        <line x1="16" y1="12" x2="20" y2="16" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="20" y1="12" x2="16" y2="16" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="20" y1="12" x2="24" y2="16" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="24" y1="12" x2="20" y2="16" stroke="#ffffff" stroke-width="1.5"/>
        <!-- Body on ground -->
        <line x1="30" y1="15" x2="60" y2="15" stroke="#ffffff" stroke-width="2"/>
        <line x1="45" y1="15" x2="40" y2="2" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="60" y1="15" x2="72" y2="8" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="60" y1="15" x2="72" y2="22" stroke="#ffffff" stroke-width="1.8"/>
        <text x="45" y="38" fill="#8b949e" font-size="9" text-anchor="middle" class="mono-text">dead process</text>
      </g>

      <!-- Bottom Narrative Box -->
      <g transform="translate(10, 140)">
        <rect width="380" height="85" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.2"/>
        <text x="15" y="24" fill="#ffffff" font-size="11.5" class="title-text">WHAT HAPPENED?</text>
        <text x="15" y="44" class="sketch-text" font-size="11.5">• 70 bytes poured into a 32-byte bucket.</text>
        <text x="15" y="62" class="sketch-text" font-size="11.5">• OS caught the stack smash and killed the process.</text>
        <text x="15" y="78" class="mono-text" font-size="10">• Result: 0% uptime, server dead.</text>
      </g>
    </g>
  </g>

  <!-- ==================== PANEL 2: SELF-HEALING COMPILER (PROTECTION & SURVIVAL) ==================== -->
  <g transform="translate(485, 85)">
    <!-- Box outline -->
    <rect width="440" height="450" rx="10" fill="#0f141c" stroke="#ffffff" stroke-width="2"/>

    <!-- Chapter Tag -->
    <rect x="15" y="-14" width="240" height="26" rx="4" fill="#ffffff"/>
    <text x="135" y="4" fill="#000000" text-anchor="middle" class="title-text" font-size="11">
      ACT 2: SELF-HEALING COMPILER
    </text>

    <!-- Sub-scene 1: Stickman SHC Guardian on Duty -->
    <g transform="translate(20, 25)">
      <!-- SHC Stickman Guardian with Shield -->
      <g transform="translate(30, 20)" class="shc-guardian">
        <!-- Head with glasses / smart eyes -->
        <circle cx="20" cy="15" r="14" stroke="#ffffff" stroke-width="2" fill="none"/>
        <circle cx="15" cy="14" r="2.5" fill="#ffffff"/>
        <circle cx="25" cy="14" r="2.5" fill="#ffffff"/>
        <!-- Confident Smile -->
        <path d="M 14 20 Q 20 25 26 20" stroke="#ffffff" stroke-width="1.8" fill="none"/>
        <!-- Body -->
        <line x1="20" y1="29" x2="20" y2="60" stroke="#ffffff" stroke-width="2"/>
        <!-- Right arm on hip, left arm holding probe wand -->
        <line x1="20" y1="38" x2="8" y2="50" stroke="#ffffff" stroke-width="2"/>
        <line x1="20" y1="38" x2="35" y2="30" stroke="#ffffff" stroke-width="2"/>
        <circle cx="37" cy="28" r="3" fill="#ffffff"/>
        <!-- Legs standing solid -->
        <line x1="20" y1="60" x2="8" y2="85" stroke="#ffffff" stroke-width="2"/>
        <line x1="20" y1="60" x2="32" y2="85" stroke="#ffffff" stroke-width="2"/>
        <!-- Tag -->
        <text x="20" y="102" fill="#ffffff" font-size="9.5" text-anchor="middle" class="mono-text" font-weight="bold">SHC Runtime</text>
      </g>

      <!-- Speech Bubble -->
      <g transform="translate(100, 10)">
        <path d="M 0 12 Q 0 0 12 0 L 295 0 Q 307 0 307 12 L 307 50 Q 307 62 295 62 L 25 62 L 10 75 L 14 62 Q 0 62 0 50 Z" fill="#161b22" stroke="#ffffff" stroke-width="1.8"/>
        <text x="153" y="24" text-anchor="middle" class="sketch-text" font-size="12">"I stay inside the process at runtime!"</text>
        <text x="153" y="44" text-anchor="middle" class="sketch-text" font-size="11.5">"I wrap all copies with shc_safe_strcpy()!"</text>
      </g>
    </g>

    <line x1="20" y1="150" x2="420" y2="150" stroke="#30363d" stroke-dasharray="3,3"/>

    <!-- Sub-scene 2: Interception & Survival -->
    <g transform="translate(20, 165)">
      <!-- Attack Stickman Attacking again -->
      <g transform="translate(10, 20)" class="attacker-bob">
        <circle cx="20" cy="15" r="14" stroke="#ffffff" stroke-width="2" fill="none"/>
        <path d="M 12 9 L 8 2" stroke="#ffffff" stroke-width="1.8"/>
        <path d="M 28 9 L 32 2" stroke="#ffffff" stroke-width="1.8"/>
        <line x1="14" y1="18" x2="26" y2="18" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="20" y1="29" x2="20" y2="60" stroke="#ffffff" stroke-width="2"/>
        <line x1="20" y1="40" x2="45" y2="40" stroke="#ffffff" stroke-width="2"/>
        <line x1="20" y1="60" x2="5" y2="85" stroke="#ffffff" stroke-width="2"/>
        <line x1="20" y1="60" x2="35" y2="85" stroke="#ffffff" stroke-width="2"/>

        <rect x="45" y="24" width="75" height="32" rx="4" fill="#000000" stroke="#ffffff" stroke-width="1.8"/>
        <text x="82" y="44" fill="#ffffff" text-anchor="middle" font-size="10" class="mono-text" font-weight="bold">70 BYTES</text>
      </g>

      <!-- The SHC Stickman Guardian Shield Barrier (Black & White) -->
      <g transform="translate(145, 10)">
        <!-- Shield -->
        <path d="M 25 5 Q 50 5 50 35 Q 50 75 25 90 Q 0 75 0 35 Q 0 5 25 5 Z" fill="#161b22" stroke="#ffffff" stroke-width="2.5" class="shield-anim"/>
        <!-- Shield Emblem / Hand Sign "STOP" -->
        <text x="25" y="45" fill="#ffffff" text-anchor="middle" font-size="16">✋</text>
        <text x="25" y="65" fill="#ffffff" text-anchor="middle" class="mono-text" font-size="8.5" font-weight="bold">BLOCKED</text>
      </g>

      <!-- Comic DENIED Star -->
      <g transform="translate(205, 5)">
        <polygon points="35,0 45,18 68,12 55,32 70,52 48,52 42,72 28,55 8,65 16,42 0,28 22,25" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <text x="35" y="35" fill="#000000" text-anchor="middle" class="title-text" font-size="9.5">NOPE!</text>
        <text x="35" y="48" fill="#000000" text-anchor="middle" class="mono-text" font-size="8">&lt; 1 µs</text>
      </g>

      <!-- Safe Stickman Celebrating next to untouched buffer -->
      <g transform="translate(305, 20)">
        <!-- Bounded Buffer -->
        <rect x="10" y="22" width="70" height="32" rx="4" fill="#000000" stroke="#ffffff" stroke-width="1.8"/>
        <text x="45" y="42" fill="#ffffff" text-anchor="middle" font-size="9" class="mono-text">buf[32] SAFE</text>

        <!-- Happy Cheering Stickman -->
        <g transform="translate(85, 0)">
          <circle cx="20" cy="15" r="14" stroke="#ffffff" stroke-width="2" fill="none"/>
          <!-- Happy V eyes -->
          <path d="M 14 13 L 17 16 L 14 19" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          <path d="M 26 13 L 23 16 L 26 19" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          <path d="M 16 22 Q 20 26 24 22" stroke="#ffffff" stroke-width="1.5" fill="none"/>
          <!-- Body -->
          <line x1="20" y1="29" x2="20" y2="60" stroke="#ffffff" stroke-width="2"/>
          <!-- Cheering Arms in Air (V for Victory) -->
          <line x1="20" y1="38" x2="5" y2="20" stroke="#ffffff" stroke-width="2"/>
          <line x1="20" y1="38" x2="35" y2="20" stroke="#ffffff" stroke-width="2"/>
          <!-- Legs dancing -->
          <line x1="20" y1="60" x2="8" y2="85" stroke="#ffffff" stroke-width="2"/>
          <line x1="20" y1="60" x2="32" y2="85" stroke="#ffffff" stroke-width="2"/>
          <text x="20" y="100" fill="#ffffff" font-size="9" text-anchor="middle" class="mono-text">alive!</text>
        </g>
      </g>

      <!-- Bottom Narrative Box -->
      <g transform="translate(10, 140)">
        <rect width="380" height="85" rx="6" fill="#161b22" stroke="#ffffff" stroke-width="1.2"/>
        <text x="15" y="24" fill="#ffffff" font-size="11.5" class="title-text">HOW SHC SAVED IT:</text>
        <text x="15" y="44" class="sketch-text" font-size="11.5">• Checked 70 &gt; 32 BEFORE touching memory.</text>
        <text x="15" y="62" class="sketch-text" font-size="11.5">• Rejected copy, zero bytes corrupted.</text>
        <text x="15" y="78" class="mono-text" font-size="10">• Exit Code: 0 | 100% service availability!</text>
      </g>
    </g>
  </g>
</svg>
